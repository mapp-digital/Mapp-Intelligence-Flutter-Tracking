buildscript {
    ext.kotlin_version = '2.3.0'
    repositories {
        //mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins{
    id 'com.android.library'
    id 'kotlin-android'
}

rootProject.allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

android {
    namespace = 'com.mapp.intelligence.plugin'
    compileSdkVersion = 36
    buildToolsVersion = '36.0.0'

    signingConfigs {
        release {
            storeFile file('release-key')
            storePassword 'mapp-intelligence'
            keyAlias 'mapp-intelligence'
            keyPassword 'mapp-intelligence'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    
    defaultConfig {
        targetSdkVersion 36
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }
}

dependencies {
    //implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation ("com.mapp.sdk:intelligence-android:5.1.13")
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation "androidx.work:work-runtime-ktx:2.11.1"
}

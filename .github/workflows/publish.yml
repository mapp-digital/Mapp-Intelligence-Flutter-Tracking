name: Publish to pub.dev

# Triggered by pushing a git tag matching v<major>.<minor>.<patch>.
# To publish version 5.0.10:
#   git tag v5.0.10
#   git push origin v5.0.10

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # tag pattern on pub.dev: v{{version}}

jobs:
  validate:
    uses: ./.github/workflows/release-checks.yml

  publish:
    name: Publish to pub.dev
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication with pub.dev
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq xz-utils

      - name: Install Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.0-stable.tar.xz" -o "$RUNNER_TEMP/flutter.tar.xz"
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(awk -F': ' '/^version: /{print $2; exit}' pubspec.yaml)"
          echo "Tag version: ${tag}"
          echo "pubspec.yaml version: ${version}"
          if [[ "${tag}" != "${version}" ]]; then
            echo "ERROR: Tag (${GITHUB_REF_NAME}) does not match pubspec.yaml version (${version})."
            exit 1
          fi

      - name: Verify OIDC availability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "ERROR: GitHub OIDC variables are missing. Trusted publishing cannot work in this run."
            exit 1
          fi

      - name: Configure pub.dev trusted publishing token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev")"
          oidc_token="$(echo "${response}" | jq -r '.value')"
          if [[ -z "${oidc_token}" || "${oidc_token}" == "null" ]]; then
            echo "ERROR: Could not obtain OIDC token for pub.dev."
            echo "${response}"
            exit 1
          fi
          printf '%s' "${oidc_token}" | dart pub token add https://pub.dev

      - name: Publish
        run: flutter pub publish --force

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create a GitHub release

    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## $VERSION$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "$NOTES" > release_notes.txt
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.txt

name: Publish to pub.dev

# Triggered by pushing a git tag matching v<major>.<minor>.<patch>.
# To publish version 5.0.10:
#   git tag v5.0.10
#   git push origin v5.0.10

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # tag pattern on pub.dev: v{{version}}

jobs:
  validate:
    uses: ./.github/workflows/release-checks.yml

  publish:
    name: Publish to pub.dev
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication with pub.dev

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        run: |
          curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.27.4-stable.tar.xz" -o "$RUNNER_TEMP/flutter.tar.xz"
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev
        run: dart pub publish --force

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create a GitHub release

    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## $VERSION$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          echo "$NOTES" > release_notes.txt
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release_notes.txt
